<!-- @dsCard group="Components" viewport="700x300" name="Feedback" subtitle="Banner, EmptyState" -->
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<div id="root" style="font-family:var(--font-sans); background:var(--bg-canvas); padding:18px; box-sizing:border-box; min-height:300px;"></div>
<script type="text/babel">
const { Banner, EmptyState } = window.SwipeDeclutter;
const trashIcon = <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 7h14" stroke="rgba(26,26,26,0.35)" strokeWidth="2" strokeLinecap="round"/><path d="M7 7l1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12" stroke="rgba(26,26,26,0.35)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const playIcon = <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 4l14 8-14 8V4z" fill="#fff"/></svg>;

function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Banner tone="dark" icon={playIcon} title="Resume Photos" subtitle="12 of 20 left" onDismiss={() => {}} />
      <Banner tone="warning" title="Deleted contacts sit in Trash for 30 days before they're gone for good." />
      <EmptyState icon={trashIcon} title="Nothing in the trash yet." description="Deleted contacts land here for 30 days." />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>

<!-- @dsCard group="Components" viewport="700x260" name="Core" subtitle="Button, IconButton, IconTile, StatusPill" -->
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<div id="root" style="font-family:var(--font-sans); background:var(--bg-canvas); padding:18px; box-sizing:border-box; min-height:260px;"></div>
<script type="text/babel">
const { Button, IconButton, IconTile, StatusPill } = window.SwipeDeclutter;

function Demo() {
  const chevron = <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  const x = <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg>;
  const check = <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.5 5.5L20 6.5" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  const person = <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#1A1A1A" strokeWidth="2"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="#1A1A1A" strokeWidth="2" strokeLinecap="round"/></svg>;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
        <Button variant="primary" fullWidth={false}>Get started</Button>
        <Button variant="secondary" fullWidth={false}>Continue with Google</Button>
        <Button variant="danger" fullWidth={false}>Delete my account</Button>
        <Button variant="ghost" fullWidth={false}>Preview error states ›</Button>
      </div>
      <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
        <IconButton size={36} icon={chevron} />
        <IconButton size={64} icon={x} color="var(--destructive)" shadow="var(--shadow-md)" />
        <IconButton size={64} icon={check} background="var(--text-primary)" color="#fff" shadow="var(--shadow-md)" />
        <IconTile size={52} background="var(--accent-blue)" icon={person} />
        <IconTile size={64} shape="circle" background="var(--accent-pink)" icon={<span style={{ fontWeight: 800, fontSize: 22, color: '#1A1A1A' }}>MC</span>} />
        <StatusPill label="Allowed" tone="success" />
        <StatusPill label="Not enabled" tone="neutral" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>

<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ink at full + fractional opacity" name="Text Colors" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); background:var(--bg-canvas); height:150px; box-sizing:border-box; padding:18px 20px; display:flex; flex-direction:column; gap:8px; justify-content:center;">
  <div style="display:flex; gap:16px; flex-wrap:wrap;">
    <span style="font-size:15px; font-weight:800; color:var(--text-primary);">Primary text</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-65);">65%</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-55);">55%</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-50);">50%</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-45);">45%</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-40);">40%</span>
    <span style="font-size:14px; font-weight:600; color:var(--text-secondary-35);">35%</span>
  </div>
  <p style="margin:0; font-size:12px; color:var(--text-secondary-45); font-weight:600;">Secondary/caption copy always rides on #1A1A1A ink at a fractional alpha — never a separate gray hex.</p>
  <div style="background:#1A1A1A; border-radius:var(--radius-md); padding:10px 14px; display:inline-flex; gap:14px; align-self:flex-start;">
    <span style="font-size:13px; font-weight:700; color:var(--text-on-dark);">on-dark 100%</span>
    <span style="font-size:13px; font-weight:700; color:var(--text-on-dark-65);">on-dark 65%</span>
  </div>
</div>

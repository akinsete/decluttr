<!-- @dsCard group="Colors" viewport="700x150" subtitle="Keep, delete, warning, native alert" name="Semantic Colors" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); display:flex; gap:12px; padding:16px; box-sizing:border-box; height:150px;">
  <div style="flex:1; background:var(--success-bg); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
    <span style="font-size:13px; font-weight:800; color:var(--success-text);">Keep / Success</span>
    <span style="font-size:10px; font-weight:600; color:var(--success-text);">#4CAF6B</span>
  </div>
  <div style="flex:1; background:var(--destructive-bg); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
    <span style="font-size:13px; font-weight:800; color:var(--destructive-text);">Delete / Destructive</span>
    <span style="font-size:10px; font-weight:600; color:var(--destructive-text);">#E85B4D · #C0392B</span>
  </div>
  <div style="flex:1; background:var(--warning-bg); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
    <span style="font-size:13px; font-weight:800; color:var(--warning-text);">Warning</span>
    <span style="font-size:10px; font-weight:600; color:var(--warning-text);">#FFF3D6</span>
  </div>
  <div style="flex:1; background:#fff; border:1px solid var(--divider); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
    <span style="font-size:13px; font-weight:800; color:var(--ios-system-blue);">iOS system blue</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-45);">#0B84FF · native alert "OK" only</span>
  </div>
</div>

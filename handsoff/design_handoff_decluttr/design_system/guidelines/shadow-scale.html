<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Soft and low-contrast only" name="Shadow Tokens" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); display:flex; align-items:center; justify-content:space-around; gap:14px; height:160px; padding:20px; box-sizing:border-box; background:var(--bg-canvas);">
  <div style="width:70px; height:70px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:var(--text-secondary-45);">xs</div>
  <div style="width:70px; height:70px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:var(--text-secondary-45);">sm</div>
  <div style="width:70px; height:70px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-md); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:var(--text-secondary-45);">md</div>
  <div style="width:70px; height:70px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-hero); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:var(--text-secondary-45);">hero</div>
  <div style="width:70px; height:70px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-card-active); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:var(--text-secondary-45);">card-active</div>
</div>

<!-- @dsCard group="Colors" viewport="700x150" subtitle="Canvas, surfaces, dividers" name="Backgrounds & Surfaces" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); display:flex; gap:14px; padding:16px; box-sizing:border-box; height:150px; align-items:stretch;">
  <div style="flex:1; background:var(--bg-canvas); border-radius:var(--radius-lg); display:flex; align-items:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:11px; font-weight:700; color:var(--text-secondary-55);">bg-canvas · #FBF6ED</span>
  </div>
  <div style="flex:1; background:var(--surface-card); border-radius:var(--radius-lg); display:flex; align-items:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:11px; font-weight:700; color:var(--text-secondary-55);">surface-card · #F4EEE2</span>
  </div>
  <div style="flex:1; background:var(--surface-white); border:1px solid var(--divider); border-radius:var(--radius-lg); display:flex; align-items:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:11px; font-weight:700; color:var(--text-secondary-55);">surface-white · #FFFFFF</span>
  </div>
  <div style="flex:1; background:var(--surface-white); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:center; gap:10px; padding:10px; box-sizing:border-box;">
    <div style="height:1px; background:var(--divider);"></div>
    <span style="font-size:10px; font-weight:700; color:var(--text-secondary-45);">divider</span>
    <div style="height:0.5px; background:var(--divider-hairline);"></div>
    <span style="font-size:10px; font-weight:700; color:var(--text-secondary-45);">divider-hairline</span>
  </div>
</div>

<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); display:flex; gap:12px; padding:16px; box-sizing:border-box; height:150px;">
  <div style="flex:1; background:var(--accent-blue); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:12px; font-weight:800; color:var(--text-primary);">Blue</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-60);">#8FD0FF · Contacts</span>
  </div>
  <div style="flex:1; background:var(--accent-pink); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:12px; font-weight:800; color:var(--text-primary);">Pink</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-60);">#FF9EC0 · Photos</span>
  </div>
  <div style="flex:1; background:var(--accent-yellow); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:12px; font-weight:800; color:var(--text-primary);">Yellow</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-60);">#FFD666</span>
  </div>
  <div style="flex:1; background:var(--accent-mint); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:12px; font-weight:800; color:var(--text-primary);">Mint</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-60);">#A9E4B8</span>
  </div>
  <div style="flex:1; background:var(--accent-lavender); border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; box-sizing:border-box;">
    <span style="font-size:12px; font-weight:800; color:var(--text-primary);">Lavender</span>
    <span style="font-size:10px; font-weight:600; color:var(--text-secondary-60);">#CBB8FF</span>
  </div>

<!-- @dsCard group="Brand" viewport="700x160" subtitle="Spring easing only — never linear" name="Motion Curves" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans); display:flex; gap:16px; height:160px; padding:18px 20px; box-sizing:border-box; background:var(--bg-canvas); align-items:center;">
  <div style="flex:1; background:#fff; border-radius:var(--radius-lg); padding:12px; box-sizing:border-box; overflow:hidden; position:relative; height:110px;">
    <span style="font-size:10px; font-weight:700; color:var(--text-secondary-45);">standard · swipe spring-back</span>
    <div style="position:absolute; bottom:14px; left:12px; width:20px; height:20px; border-radius:50%; background:var(--accent-blue); animation:demoStandard 1.8s var(--ease-spring-standard) infinite;"></div>
  </div>
  <div style="flex:1; background:#fff; border-radius:var(--radius-lg); padding:12px; box-sizing:border-box; overflow:hidden; position:relative; height:110px;">
    <span style="font-size:10px; font-weight:700; color:var(--text-secondary-45);">bouncy · dock indicator</span>
    <div style="position:absolute; bottom:14px; left:12px; width:20px; height:20px; border-radius:50%; background:var(--accent-pink); animation:demoBouncy 1.8s var(--ease-spring-bouncy) infinite;"></div>
  </div>
  <div style="flex:1; background:#fff; border-radius:var(--radius-lg); padding:12px; box-sizing:border-box; overflow:hidden; position:relative; height:110px;">
    <span style="font-size:10px; font-weight:700; color:var(--text-secondary-45);">swift · card morph</span>
    <div style="position:absolute; bottom:14px; left:12px; width:20px; height:20px; border-radius:50%; background:var(--accent-mint); animation:demoSwift 1.8s var(--ease-spring-swift) infinite;"></div>
  </div>
</div>
<style>
@keyframes demoStandard { 0%,10%{transform:translateX(0)} 50%{transform:translateX(210px)} 60%,100%{transform:translateX(0)} }
@keyframes demoBouncy { 0%,10%{transform:translateX(0)} 50%{transform:translateX(210px)} 60%,100%{transform:translateX(0)} }
@keyframes demoSwift { 0%,10%{transform:translateX(0)} 50%{transform:translateX(210px)} 60%,100%{transform:translateX(0)} }
</style>

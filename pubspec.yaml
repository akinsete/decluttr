name: decluttr
description: Decluttr — swipe to clean up contacts and photos.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  auto_route: ^11.1.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  phosphoricons_flutter: ^1.0.0
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  theme_tailor_annotation: ^3.1.3
  meta: ^1.16.0
  uuid: ^4.5.3
  permission_handler: ^12.0.3
  flutter_contacts: ^2.2.2
  photo_manager: ^3.9.0
  video_player: ^2.10.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_analytics: ^12.4.3
  firebase_app_check: ^0.4.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  auto_route_generator: ^10.4.0
  riverpod_generator: ^4.0.3
  pigeon: ^26.3.2
  flutter_gen_runner: 5.14.1
  freezed: ^3.2.5
  theme_tailor: ^3.1.3
  mockito: ^5.4.6

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/.env.production
    - env/.env.development
    - assets/handoff/
    - assets/handoff/confetti/
    - assets/google_fonts/
